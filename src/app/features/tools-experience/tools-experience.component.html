<div class="tools">
  <header class="section-header">
    <p class="section-label">Toolkit</p>
    <h2 class="section-title">Tools &amp; Technologies</h2>
    <p class="section-sub">A snapshot of what I work with day to day.</p>
  </header>

  <div class="grid" appReveal [stagger]="true">
    <div class="tool tool-html">
      <div class="tool-icon"><i class="fab fa-html5"></i></div>
      <div class="tool-meta">
        <h4>HTML 5</h4>
        <small>11 years</small>
      </div>
    </div>
    <div class="tool tool-css">
      <div class="tool-icon"><i class="fab fa-css3-alt"></i></div>
      <div class="tool-meta">
        <h4>CSS · LESS · SASS</h4>
        <small>11 years</small>
      </div>
    </div>
    <div class="tool tool-js">
      <div class="tool-icon"><i class="fab fa-js-square"></i></div>
      <div class="tool-meta">
        <h4>JavaScript</h4>
        <small>10 years</small>
      </div>
    </div>
    <div class="tool tool-ts">
      <div class="tool-icon"><i class="fab fa-js-square"></i></div>
      <div class="tool-meta">
        <h4>TypeScript</h4>
        <small>8 years</small>
      </div>
    </div>
    <div class="tool tool-angular">
      <div class="tool-icon"><i class="fab fa-angular"></i></div>
      <div class="tool-meta">
        <h4>Angular 2+</h4>
        <small>8 years</small>
      </div>
    </div>
    <div class="tool tool-nodejs">
      <div class="tool-icon"><i class="fab fa-node"></i></div>
      <div class="tool-meta">
        <h4>Node.js</h4>
        <small>6 years</small>
      </div>
    </div>
    <div class="tool tool-nest">
      <div class="tool-icon"><i class="fab fa-node-js"></i></div>
      <div class="tool-meta">
        <h4>NestJS</h4>
        <small>6 years</small>
      </div>
    </div>
    <div class="tool tool-gulp">
      <div class="tool-icon"><i class="fab fa-gulp"></i></div>
      <div class="tool-meta">
        <h4>Gulp · Webpack</h4>
        <small>6 years</small>
      </div>
    </div>
    <div class="tool tool-docker">
      <div class="tool-icon"><i class="fab fa-docker"></i></div>
      <div class="tool-meta">
        <h4>Docker</h4>
        <small>2 years</small>
      </div>
    </div>
    <div class="tool tool-git">
      <div class="tool-icon"><i class="fa fa-tools"></i></div>
      <div class="tool-meta">
        <h4>Git · Jira</h4>
        <small>& more</small>
      </div>
    </div>
  </div>
</div>
